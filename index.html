<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로또 번호 뽑기</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 상단 바: 테마 / 화면 모드 선택 -->
    <header class="topbar">
        <nav class="nav">
            <a href="index.html" class="current">🍀 로또</a>
            <a href="receipt.html">🧾 영수증 스캐너</a>
            <a href="cutout.html">✂️ 누끼 메이커</a>
        </nav>

        <div class="settings">
            <div class="setting">
                <span class="setting-label">테마</span>
                <div class="segmented" id="themeSelect">
                    <button type="button" data-value="auto">자동</button>
                    <button type="button" data-value="light">☀️ 라이트</button>
                    <button type="button" data-value="dark">🌙 다크</button>
                </div>
            </div>
            <div class="setting">
                <span class="setting-label">화면</span>
                <div class="segmented" id="layoutSelect">
                    <button type="button" data-value="auto">자동</button>
                    <button type="button" data-value="pc">🖥️ PC</button>
                    <button type="button" data-value="mobile">📱 모바일</button>
                </div>
            </div>
        </div>
    </header>

    <main class="app">

        <!-- 뽑기 -->
        <section class="panel draw-panel">
            <header>
                <h1>로또 번호 뽑기</h1>
                <p class="subtitle">1 ~ 45 중 겹치지 않는 번호 6개와 보너스 번호 1개를 뽑아요.</p>
            </header>

            <div class="games">
                <span class="games-label">게임 수</span>
                <div class="segmented" id="gameSelect">
                    <button type="button" data-value="1" class="active">1</button>
                    <button type="button" data-value="2">2</button>
                    <button type="button" data-value="3">3</button>
                    <button type="button" data-value="4">4</button>
                    <button type="button" data-value="5">5</button>
                </div>
            </div>

            <div id="results" class="results" aria-live="polite">
                <div class="placeholder">버튼을 눌러 행운의 번호를 뽑아보세요!</div>
            </div>

            <div class="actions">
                <button id="drawButton" class="primary">번호 뽑기</button>
                <button id="copyButton" class="ghost" disabled>복사</button>
            </div>

            <!-- A 게임 분석 -->
            <dl class="stats" id="stats">
                <div><dt>번호 합계</dt><dd id="statSum">-</dd></div>
                <div><dt>홀 : 짝</dt><dd id="statOddEven">-</dd></div>
                <div><dt>저 : 고</dt><dd id="statLowHigh">-</dd></div>
            </dl>

            <p class="hint">스페이스바로도 뽑을 수 있어요</p>
        </section>

        <!-- 번호 고정 / 제외 -->
        <section class="panel picker-panel">
            <div class="panel-head">
                <h2>번호 고정 · 제외</h2>
                <button id="clearPickButton" class="link">선택 해제</button>
            </div>
            <p class="panel-desc">
                번호를 누를 때마다 <span class="tag fixed">고정</span> →
                <span class="tag excluded">제외</span> → 선택 안 함 순서로 바뀌어요.
                고정은 최대 5개까지 가능해요.
            </p>
            <div id="numberGrid" class="number-grid"></div>
            <p class="panel-foot">작은 숫자는 지금까지 뽑힌 횟수예요.</p>
        </section>

        <!-- 기록 -->
        <section class="panel history-panel">
            <div class="panel-head">
                <h2 id="count">뽑은 기록 · 0회</h2>
                <button id="resetButton" class="link">기록 지우기</button>
            </div>
            <ol id="historyList" class="history-list">
                <li class="empty">아직 뽑은 번호가 없어요</li>
            </ol>
        </section>

    </main>

    <div id="toast" class="toast" hidden></div>

    <script src="script.js"></script>

</body>
</html>
