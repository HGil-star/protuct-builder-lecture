<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>누끼 메이커 – 배경 투명하게</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="ui.css">
</head>

<body>

    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="cutout.html">누끼 메이커</a>
            <div class="segmented" id="themeSelect">
            <button type="button" data-value="auto">자동</button>
            <button type="button" data-value="light">☀️</button>
            <button type="button" data-value="dark">🌙</button>
        </div>
        </div>
    </header>
    <div class="navigation-bar">
        <nav class="nav" aria-label="도구 선택">
            <a href="index.html">DWG → PDF</a>
            <a href="receipt.html">영수증 스캐너</a>
            <a href="cutout.html" class="current">✂누끼 메이커</a>
        </nav>
    </div>

    <section class="hero">
        <h1>누끼 메이커</h1>
        <p>
            사진을 올리면 배경을 지우고 투명한 PNG로 만들어 줘요.
            물체 주변의 필요 없는 여백도 자동으로 잘라내요.
        </p>
    </section>

    <main class="tool">

        <!-- 설정 -->
        <section class="panel controls">
            <label class="dropzone" id="dropzone">
                <input type="file" id="fileInput" accept="image/*" hidden>
                <span class="dropzone-icon">🖼️</span>
                <strong>사진 올리기</strong>
                <span>클릭하거나, 끌어다 놓거나, Ctrl+V로 붙여넣기</span>
            </label>

            <div class="field">
                <span class="field-label">배경 제거 방식</span>
                <div class="segmented" id="methodSelect">
                    <button type="button" data-value="ai" class="active">🤖 AI 정밀</button>
                    <button type="button" data-value="color">🎨 단색 배경</button>
                </div>
                <p class="field-help" id="methodHelp">
                    복잡한 배경도 잘 지워요. 처음 한 번은 AI 모델(약 100MB)을 내려받아요.
                </p>
            </div>

            <div class="field" id="toleranceField" hidden>
                <label class="field-label" for="tolerance">
                    배경 인식 범위 <output id="toleranceValue">40</output>
                </label>
                <input type="range" id="tolerance" min="5" max="120" value="40">
                <p class="field-help">물체까지 지워지면 낮추고, 배경이 남으면 높여요.</p>
            </div>

            <div class="field">
                <label class="check">
                    <input type="checkbox" id="trimCheck" checked>
                    필요 없는 여백 잘라내기
                </label>
                <label class="check">
                    <input type="checkbox" id="speckCheck" checked>
                    작은 잡티 지우기
                </label>
            </div>

            <div class="field" id="paddingField">
                <label class="field-label" for="padding">
                    남길 여백 <output id="paddingValue">0px</output>
                </label>
                <input type="range" id="padding" min="0" max="100" value="0">
            </div>

            <button id="downloadButton" class="primary" disabled>PNG 다운로드</button>
        </section>

        <!-- 미리보기 -->
        <section class="panel preview">
            <div class="preview-grid">
                <figure>
                    <figcaption>원본 <span id="sourceSize"></span></figcaption>
                    <div class="canvas-box" id="sourceBox">
                        <span class="empty">사진을 올려 주세요</span>
                    </div>
                </figure>
                <figure>
                    <figcaption>결과 <span id="resultSize"></span></figcaption>
                    <div class="canvas-box" id="resultBox">
                        <span class="empty">여기에 결과가 나와요</span>
                    </div>
                </figure>
            </div>

            <div class="status" id="status" hidden>
                <span id="statusText"></span>
                <div class="progress"><div id="progressBar"></div></div>
            </div>
        </section>

    </main>

    <script src="imagekit.js"></script>
    <script src="cutout.js"></script>

</body>
</html>
